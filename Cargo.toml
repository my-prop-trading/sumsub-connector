[package]
name = "sumsub-connector"
version = "0.4.7"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
http = "1.0.0"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["full"] }
flurl = { tag = "0.6.1", git = "https://github.com/MyJetTools/fl-url.git" }
url = "*"
error-chain = { version = "0.12.4", default-features = false }
# Pinned to the digest-0.10 generation. Unpinned (`*`) pulled hmac 0.13 (digest 0.11), where
# `new_from_slice` moved off the imported `Mac` trait and validate_webhook.rs failed to build.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "*"
# Pinned: `*` drifted to serde_qs 1.x, which serializes an Option::None query field as a
# bare key and broke the accessTokens request against SumSub (400). Skip-on-None guards the
# behaviour, but keep the major version fixed so it can't shift under us again.
serde_qs = "1"

